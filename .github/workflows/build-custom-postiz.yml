name: Build Custom Postiz (test)

on:
  push:
    branches:
      - fix/social-oauth-v2.25.1
    paths:
      - 'libraries/nestjs-libraries/src/integrations/social/**'
      - 'Dockerfile.dev'
      - '.github/workflows/build-custom-postiz.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ghcr.io/oguzhaanferli/postiz-app:oauth-v2.25.1-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_VERSION=v2.25.1-oauth
          cache-from: type=gha
          cache-to: type=gha,mode=max
